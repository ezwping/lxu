<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="临序空间设计，专注榆林神木私宅整装、别墅设计、商铺办公室工装、旧房翻新改造，全案空间设计落地服务。">
<link rel="icon" href="social-icon/lxbqlogo.png" type="image/png">
<link rel="apple-touch-icon" href="social-icon/lxbqlogo.png">
<title>临序空间设计 - 私宅与商业空间全案设计</title>
<style>
:root{
--gold:#c8a469;
--bg-page:#ffffff;
--bg-card:#f7f7f7;
--text-main:#222222;
--text-sub:#333333;
--border-color:#dddddd;
}
[data-theme="dark"]{
--bg-page:#151515;
--bg-card:#1f1f1f;
--text-main:#eeeeee;
--text-sub:#cccccc;
--border-color:#333333;
}
[data-theme="auto"]{
color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
html[data-theme="auto"]{
--bg-page:#151515;
--bg-card:#1f1f1f;
--text-main:#eeeeee;
--text-sub:#cccccc;
--border-color:#333333;
}
}
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: "Microsoft YaHei", system-ui, -apple-system, sans-serif;
}
html {
scroll-behavior: smooth;
background-color: var(--bg-page);
color: var(--text-main);
transition: background-color 0.35s ease, color 0.35s ease;
}
body {
background-color: var(--bg-page);
}
header {
background-color: #181818;
position: sticky;
top: 0;
z-index: 999;
}
.nav-container {
max-width: 1240px;
margin: 0 auto;
display: flex;
justify-content: space-between;
align-items: center;
padding: 0 20px;
height: 72px;
gap: 20px;
}
.logo img {
height: 52px;
width: auto;
display: block;
}
.nav-right-wrap {
display: flex;
align-items: center;
gap: 28px;
}
.main-nav {
display: flex;
align-items: center;
gap: 32px;
}
.main-nav a {
color: #cccccc;
text-decoration: none;
font-size: 15px;
transition: 0.25s;
}
.main-nav a:hover {
color: var(--gold);
}
.theme-dropdown{
position: relative;
}
.theme-trigger{
width:36px;
height:36px;
border-radius:50%;
border:1px solid #666;
background:transparent;
color:#ccc;
font-size:16px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
transition:0.3s;
}
.theme-trigger:hover{
border-color:var(--gold);
color:var(--gold);
}
.theme-menu{
position:absolute;
top:46px;
right:0;
background:#222;
border-radius:6px;
padding:8px;
display:none;
flex-direction: column;
gap:6px;
z-index:9999;
box-shadow:0 6px 14px rgba(0,0,0,0.35);
}
.theme-menu.open {
display:flex;
}
.theme-option {
width:34px;
height:34px;
border-radius:50%;
border:1px solid #444;
background:transparent;
color:#ccc;
font-size:16px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
transition:0.25s;
}
.theme-option.active {
border-color:var(--gold);
color:var(--gold);
}
.theme-option:hover {
border-color:var(--gold);
color:var(--gold);
}
.banner {
height: 380px;
background: linear-gradient(rgba(0,0,0,0.65),rgba(0,0,0,0.75)),url("img/banner-bg.png");
background-size: cover;
background-position: center;
background-repeat: no-repeat;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
color: #fff;
position: relative;
overflow: hidden;
}
.banner::after {
content:"";
position:absolute;
width:100%;
height:100%;
background: radial-gradient(ellipse at 20% 80%, rgba(200,164,105,0.12) 0%, transparent 60%),
radial-gradient(ellipse at 80% 20%, rgba(160,180,210,0.1) 0%, transparent 60%);
pointer-events: none;
}
.banner h1 {
font-size: 40px;
margin-bottom: 12px;
z-index:2;
}
.banner p {
font-size: 18px;
color: #dddddd;
z-index:2;
}
.banner-social-wrap {
display:flex;
flex-direction:column;
align-items:flex-start;
gap:12px;
position:absolute;
right:40px;
top:30px;
z-index:3;
}
.banner-social-list {
display:flex;
align-items:center;
gap:22px;
justify-content:flex-start;
}
.banner-social-list span,
.banner-social-list a {
width:44px;
height:44px;
display:flex;
align-items:center;
justify-content:center;
background:rgba(255,255,255,0.15);
border-radius:50%;
transition:0.3s;
}
.banner-social-list span:hover,
.banner-social-list a:hover {
background:var(--gold);
}
.banner-social-list img {
width:26px;
height:26px;
object-fit:contain;
}
.wrap {
max-width: 1240px;
margin: 70px auto;
padding: 0 20px;
}
.case-block{
background:#181818;
padding:60px 20px;
margin:40px 0;
text-align:center;
}
.case-block h2{
color:#fff;
font-size:32px;
position:relative;
display:inline-block;
padding-bottom:16px;
margin-bottom:40px;
}
.case-block h2::after{
content:"";
position:absolute;
left:0;
bottom:0;
width:100%;
height:2px;
background-color:var(--gold);
}
.case-btn-wrap{
width:100%;
}
.case-btn-group{
display:flex;
flex-wrap:wrap;
gap:24px;
justify-content:center;
margin-bottom:24px;
}
.case-btn-group:last-child{
margin-bottom:0;
}
.case-btn-group a{
color:#fff;
text-decoration:none;
border:1px solid var(--gold);
padding:14px 30px;
border-radius:2px;
transition:0.3s;
}
.case-btn-group a:hover{
background-color:var(--gold);
color:#111;
}
.gallery-grid {
display: grid;
grid-template-columns: repeat(3,1fr);
gap: 24px;
}
.process-grid {
display: grid;
grid-template-columns: repeat(4,1fr);
gap: 24px;
}
.gallery-item {
overflow: hidden;
border-radius: 6px;
}
.gallery-item img {
width: 100%;
height: 240px;
object-fit: cover;
transition: 0.4s;
background: #e9e9e9;
}
.process-item{
display:flex;
justify-content:center;
align-items:center;
padding:16px;
}
.process-item img {
width: 90%;
height: auto;
border-radius:6px;
transition:0.4s;
box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}
.process-item img:hover{
transform: scale(1.03);
}
.gallery-item img:hover {
transform: scale(1.05);
}
#home, #contact {
scroll-margin-top: 80px;
}
.contact-wrap {
display: flex;
align-items: center;
justify-content: center;
gap:60px;
flex-wrap: wrap;
}
.contact-text {
line-height: 2.2;
font-size: 17px;
color: var(--text-sub);
}
.contact-text a {
color:var(--gold);
text-decoration:none;
}
.contact-text a:hover {
text-decoration:underline;
}
.douyin-box {
text-align:center;
}
.douyin-row {
display:flex;
gap:30px;
align-items:center;
justify-content:center;
flex-wrap:wrap;
}
.douyin-box img {
width:160px;
height:auto;
border-radius:8px;
border:2px solid var(--gold);
}
.douyin-box p {
margin-top:12px;
color: var(--text-sub);
}
footer {
background: #181818;
color: #aaa;
text-align: center;
padding: 35px 0;
margin-top: 60px;
}
@media (max-width:992px){
.gallery-grid {grid-template-columns: repeat(2,1fr);}
.process-grid {grid-template-columns: repeat(2,1fr);}
.contact-wrap {gap:30px;}
.banner-social-wrap {
right:20px;
}
.banner-social-list {
gap:20px;
}
.banner-social-list span,
.banner-social-list a {
width:42px;
height:42px;
}
.banner-social-list img {
width:24px;
height:24px;
}
.nav-right-wrap {gap:15px;}
.main-nav {gap:20px;}
}
@media (max-width:640px){
.nav-container {height:auto;padding:15px 20px;flex-direction:column;gap:15px;}
.nav-right-wrap {flex-wrap: wrap;justify-content:center;gap:16px;}
.main-nav {flex-wrap:wrap;justify-content:center;gap:16px;}
.main-nav a {font-size:14px;}
.banner h1 {font-size:28px;}
.banner-social-wrap{
position:static;
margin-bottom:20px;
align-items:flex-start;
}
.banner-social-list{
gap:20px;
flex-wrap:wrap;
justify-content:flex-start;
}
.banner-social-list span,
.banner-social-list a{
width:42px;
height:42px;
}
.banner-social-list img{
width:24px;
height:24px;
}
.gallery-grid{
grid-template-columns: 1fr;
gap: 20px;
}
.process-grid{
grid-template-columns:1fr;
gap:20px;
}
.gallery-item img{
height: auto;
}
.logo img{height:44px;}
.douyin-box img{width:140px;}
.wrap {
padding: 0 12px;
}
.case-btn-group{
gap:14px;
}
.case-btn-group a{
padding:10px 18px;
font-size:14px;
}
.case-block h2{
font-size:24px;
}
}
</style>
</head>

<script>
// 渲染按钮函数
function renderBtn(containerId, arr) {
  const wrap = document.getElementById(containerId);
  let html = '';
  const row1 = arr.slice(0,6);
  const row2 = arr.slice(6,12);
  html += '<div class="case-btn-group">';
  row1.forEach(item=>{
    html += `<a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.name}</a>`
  })
  html += '</div>';
  html += '<div class="case-btn-group">';
  row2.forEach(item=>{
    html += `<a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.name}</a>`
  })
  html += '</div>';
  wrap.innerHTML = html;
}
renderBtn('box1', window.BUTTON_CONFIG);
renderBtn('box2', window.BUTTON_CONFIG_2);

// 主题切换脚本
const themeWrap = document.getElementById('themeWrap');
const themeBtn = document.getElementById('themeBtn');
const themeMenu = document.getElementById('themeMenu');
const htmlDom = document.documentElement;
const themeList = themeMenu.querySelectorAll('.theme-option');
let localTheme = localStorage.getItem('site-theme') || 'auto';
htmlDom.setAttribute('data-theme', localTheme);
themeList.forEach(btn=>{
  if(btn.dataset.value === localTheme) btn.classList.add('active');
  btn.onclick = ()=>{
    const val = btn.dataset.value;
    htmlDom.setAttribute('data-theme', val);
    localStorage.setItem('site-theme', val);
    themeList.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    themeMenu.classList.remove('open');
  }
})
themeBtn.onclick = (e)=>{
  e.stopPropagation();
  themeMenu.classList.toggle('open');
}
document.addEventListener('click', ()=>{
  themeMenu.classList.remove('open');
})
</script>
