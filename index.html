.theme-menu{

top:46px;

}
.theme-menu.open {

justify-content: center;
align-items: center;

height:100%;

<script>
// HTML特殊字符转义，消除XSS风险
function htmlEscape(str) {
if (!str) return "";
return String(str)
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");
}function renderButtons () {
// 判断外部 JS 是否加载成功
if (!window.BUTTON_CONFIG || !Array.isArray(window.BUTTON_CONFIG)) {
const fallbackHtml = `

                    <div class="link-group">
<a href="#" target="_blank">现代极简案例</a>
<a href="#" target="_blank">现代简约案例</a>
<a href="#" target="_blank">意式轻奢案例</a>
<a href="#" target="_blank">宋式美学案例</a>
<a href="#" target="_blank">新 中 式 案 例</a>
<a href="#" target="_blank">中古神秘案例</a>
</div>
<div class="link-group" style="margin-top:16px;">
<a href="#" target="_blank">别墅大宅设计</a>
<a href="#" target="_blank">复式跃层设计</a>
<a href="#" target="_blank">平层整装案例</a>
<a href="#" target="_blank">办公空间方案</a>
<a href="#" target="_blank">餐饮门店设计</a>
<a href="#" target="_blank">娱乐休闲案例</a>
</div>`;
document.querySelector(".section-title").insertAdjacentHTML("afterend", fallbackHtml);
return;
}
const caseData = window.BUTTON_CONFIG;
const titleDom = document.querySelector(".section-title");
const rowOne = caseData.slice(0, 6);
const rowTwo = caseData.slice(6);

function buildRow(list) {
let html = `<div class="link-group">`;
list.forEach(item => {
const name = htmlEscape(item.name);
const link = htmlEscape(item.link);
html += `<a href="${link}" target="_blank">${name}</a>`;
});
html += `</div>`;
return html;
}

let renderHtml = buildRow(rowOne);
renderHtml += `<div class="link-group" style="margin-top:16px;">`;
rowTwo.forEach(item => {
const name = htmlEscape(item.name);
const link = htmlEscape(item.link);
renderHtml += `<a href="${link}" target="_blank">${name}</a>`;
});
renderHtml += `</div>`;

titleDom.insertAdjacentHTML("afterend", renderHtml);
}

// 轮询检测外部配置文件加载
const timer = setInterval (() => {
if (window.BUTTON_CONFIG) {
clearInterval (timer);
renderButtons ();
}
}, 60);
// 超时兜底，最多等待 1.5 秒
setTimeout (() => {
clearInterval (timer);
if (!window.BUTTON_CONFIG) renderButtons ();
}, 1500);</script>

const html = document.documentElement;
const triggerBtn = document.getElementById('triggerBtn');
const themeMenu = document.getElementById('themeMenu');
const options = document.querySelectorAll('.theme-option');
const storageKey = "site-theme";
const iconMap = {
auto:"🔄",
light:"☀️",
dark:"🌙"
};

// 读取缓存初始化
let currentMode = localStorage.getItem(storageKey) || "auto";
applyMode(currentMode);

// 应用主题 + 更新UI
function applyMode(mode){
currentMode = mode;
html.setAttribute('data-theme', mode);
triggerBtn.textContent = iconMap[mode];
options.forEach(opt=>{
opt.classList.toggle('active', opt.dataset.mode === mode);
})
localStorage.setItem(storageKey, mode);
}

// 点击按钮展开/收起面板
triggerBtn.addEventListener('click',(e)=>{
e.stopPropagation();
themeMenu.classList.toggle('open');
})

// 点击选项切换模式
options.forEach(opt=>{
opt.addEventListener('click',()=>{
applyMode(opt.dataset.mode);
themeMenu.classList.remove('open');
})
})

// 点击页面空白关闭弹窗
document.addEventListener('click',()=>{
themeMenu.classList.remove('open');
})
</script></body>
